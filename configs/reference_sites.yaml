# Reference Sites for Data Validation
# 차트 생성 시 데이터 교차 검증에 사용하는 레퍼런스 사이트 목록
#
# 구조:
#   protocol:
#     metric:
#       - name: 소스 이름
#         url: 웹사이트 URL (사람이 확인하는 용도)
#         api: API 엔드포인트 (자동 검증용, optional)
#         auth: 인증 방식 (none, cloudflare, api_key)
#         notes: 비고
#         fields: 매핑 가능한 필드들

# ============================================================
# Hyperliquid
# ============================================================
hyperliquid:
  revenue:
    - name: ASXN Hyperscreener
      url: https://hyperscreener.asxn.xyz/revenue
      api: https://api-hyperliquid.asxn.xyz/api/buyback/revenues
      auth: cloudflare  # Turnstile 보호, 브라우저 세션 필요
      notes: |
        Revenue = HyperCore Buybacks + HyperEVM Burn + Auction Burn
        바이백/소각 기반 (output side). 2025-03-20부터 데이터 존재.
        API 응답: { summary: {...}, data: [{date, HyperCore Buybacks, HyperEVM Burn, Auction Burn, total}] }
      fields:
        total_revenue: total
        hypercore_buybacks: HyperCore Buybacks
        hyperevm_burn: HyperEVM Burn
        auction_burn: Auction Burn

    - name: DefiLlama
      url: https://defillama.com/fees/hyperliquid
      api: https://api.llama.fi/summary/fees/hyperliquid?dataType=dailyRevenue
      auth: none
      notes: |
        Revenue = Perp + Spot trading fee 기반 (input side). HLP revenue = 0.
        Fees = Perp + Spot + HLP fees (총 거래 수수료).
        2024-12-23부터 데이터 존재. Breakdown은 Hyperliquid L1 키 아래 nested.
        ASXN과 다른 정의: ASXN은 바이백/소각 집행액, DFL은 수수료 수입.
        겹치는 기간 ASXN/DFL 비율: ~91% (2025-03~07 ±5%, 2025-08 이후 -15~21%)
      fields:
        total_revenue: totalDataChart
        total_fees: totalDataChart (fees endpoint)
        perp_revenue: totalDataChartBreakdown > Hyperliquid L1 > Hyperliquid Perps
        spot_revenue: totalDataChartBreakdown > Hyperliquid L1 > Hyperliquid Spot Orderbook
        hlp_revenue: totalDataChartBreakdown > Hyperliquid L1 > Hyperliquid HLP

  volume:
    - name: ASXN Hyperscreener (Perp)
      url: https://hyperscreener.asxn.xyz/home
      api: https://api-hyperliquid.asxn.xyz/api/cloudfront/total_volume
      auth: cloudflare
      notes: |
        Home page "Total Volume" = Perp only (BTC, ETH, SOL, HYPE symbols).
        Open Interest도 같은 페이지에 표시.

    - name: ASXN Hyperscreener (Spot)
      url: https://hyperscreener.asxn.xyz/spot/overview
      api: https://api-hyperliquid.asxn.xyz/api/cloudfront/cumulative_usd_volume
      auth: cloudflare
      notes: |
        Spot volume은 별도 페이지. 심볼이 다름 (UBTC, UETH, USOL).
        2025-07-16부터 데이터 존재 (65일 gap vs Artemis).

    - name: Artemis
      url: https://app.artemis.xyz
      auth: api_key
      notes: |
        Spot + Perp volume 별도 제공. 가장 긴 기간 데이터 (2023-06-13~).
        CSV export 가능. Spot은 2024-09-19부터.
      fields:
        perp_volume: Hyperliquid - Perpetuals Volume
        spot_volume: Hyperliquid - Spot Volume

    - name: DefiLlama DEX
      url: https://defillama.com/dexs/hyperliquid
      api: https://api.llama.fi/summary/dexs/hyperliquid
      auth: none
      notes: Spot DEX volume. Cumulative ~$138B.

  fees:
    - name: DefiLlama
      url: https://defillama.com/fees/hyperliquid
      api: https://api.llama.fi/summary/fees/hyperliquid
      auth: none
      notes: |
        Total fees with Perp/Spot/HLP breakdown.
        All-time: $1.09B (Perp 93.5%, Spot 4.7%, HLP 1.9%)

  tvl:
    - name: DefiLlama
      url: https://defillama.com/protocol/hyperliquid
      api: https://api.llama.fi/protocol/hyperliquid
      auth: none

    - name: ASXN Hyperscreener
      url: https://hyperscreener.asxn.xyz/network/network
      auth: cloudflare

  buybacks:
    - name: ASXN Hyperscreener
      url: https://hyperscreener.asxn.xyz/revenue
      api: https://api-hyperliquid.asxn.xyz/api/buyback/hl-buybacks
      auth: cloudflare
      notes: |
        Daily buyback table with SIZE, NOTIONAL AMOUNT, AVG PRICE, CUMULATIVE.
        Additional APIs:
          - /api/buyback/revenue-metrics (summary)
          - /api/buyback/af-buyback-metrics (AF metrics)
          - /api/buyback/assistance-fund-holdings (AF balance)
          - /api/buyback/hype-price (HYPE price)

  network:
    - name: ASXN Hyperscreener
      url: https://hyperscreener.asxn.xyz/network/network
      auth: cloudflare
      notes: |
        Total Users, Total Deposits, Total Withdrawals,
        Daily Volume, OI, Funding Rate, Liquidations 등.
        API base: https://d2v1fiwobg9w6.cloudfront.net/

# ============================================================
# Validation Rules
# ============================================================
validation:
  tolerances:
    revenue: 10      # % — ASXN vs DFL은 정의가 다르므로 넓은 허용
    fees: 5          # %
    volume: 5        # %
    tvl: 5           # %
    price: 1         # %
    balance: 0.1     # %
    buybacks: 2      # %

  # 소스 우선순위 (같은 지표에 여러 소스가 있을 때)
  priority:
    - protocol_official    # 프로토콜 공식 사이트/API
    - asxn                 # ASXN Hyperscreener
    - defillama            # DefiLlama
    - artemis              # Artemis
    - dune                 # Dune Analytics
    - coingecko            # CoinGecko

  # 교차 검증 시 주의사항
  caveats:
    - "ASXN Revenue vs DefiLlama Revenue는 정의가 다름 (buyback vs fee 기반)"
    - "Cloudflare Turnstile 보호 API는 브라우저 세션으로만 접근 가능"
    - "DefiLlama breakdown은 'Hyperliquid L1' 키 아래 nested 구조"
    - "Artemis Spot volume은 2024-09-19부터, ASXN Spot은 2025-07-16부터"
